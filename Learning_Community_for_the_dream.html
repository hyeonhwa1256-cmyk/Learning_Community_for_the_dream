var w=document.getElementById("sw"),n=3,c=0;function goTo(i){c=Math.max(0,Math.min(n-1,i));w.style.transform="translateX(-"+(c*100)+"vw)";document.getElementById("counter").textContent=(c+1)+" / "+n;document.getElementById("progress").style.width=(((c+1)/n)*100)+"%";document.getElementById("prevBtn").disabled=c===0;document.getElementById("nextBtn").disabled=c===n-1;document.querySelectorAll(".dot").forEach(function(d,j){d.className="dot"+(j===c?" active":"")});}function navigate(d){goTo(c+d);}document.addEventListener("keydown",function(e){if(e.key==="ArrowRight"||e.key==="ArrowDown")navigate(1);if(e.key==="ArrowLeft"||e.key==="ArrowUp")navigate(-1);});var tx=0,ty=0,sw=false;w.addEventListener("touchstart",function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;sw=false;},{passive:true});w.addEventListener("touchmove",function(e){var dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;if(!sw&&Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10)sw=true;},{passive:true});w.addEventListener("touchend",function(e){if(!sw)return;var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)navigate(dx<0?1:-1);});if("ontouchstart" in window)document.getElementById("kh").style.display="none";goTo(0);
</script>
</body>
</html>
